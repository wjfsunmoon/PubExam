# Render 一键部署配置文件
# 连接 GitHub 仓库后 Render 会自动读取此文件完成配置

services:
  - type: web
    name: pubexam
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true            # Render 自动生成随机密钥
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENAI_API_KEY
        sync: false                     # 可选：在 Render 后台手动填入
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: PORT
        value: 3001
    healthCheckPath: /api/health
    autoDeploy: true                   # push 到 main 自动重新部署
